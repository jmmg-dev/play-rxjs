name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Fails if a test fails or coverage drops below 90 % (thresholds live in angular.json)
      - run: npm run test:coverage
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
