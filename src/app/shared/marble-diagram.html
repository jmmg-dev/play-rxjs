<section class="marble" aria-labelledby="marble-title">
  <div class="marble__head">
    <h2 id="marble-title">{{ 'ui.marble.title' | t }}</h2>
    <p>{{ 'ui.marble.hint' | t }}</p>
  </div>

  <div class="marble__card">
    <div class="marble__scroll">
      <svg
        class="marble__svg"
        xmlns="http://www.w3.org/2000/svg"
        [attr.viewBox]="'0 0 ' + width + ' ' + height()"
        role="img"
        [attr.aria-label]="data().op + ' → ' + summary()"
      >
        <defs>
          <linearGradient id="marble-grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f299fb" />
            <stop offset="0.5" stop-color="#c9b6ff" />
            <stop offset="1" stop-color="#a3feff" />
          </linearGradient>
        </defs>

        <ng-template #laneTpl let-lane>
          <line class="lane" [attr.x1]="lineStart()" [attr.x2]="lane.complete ?? lane.error ?? lineEnd" [attr.y1]="lane.y" [attr.y2]="lane.y" />
          @if (lane.complete === undefined && lane.error === undefined) {
            <path class="lane__arrow" [attr.d]="'M' + (lineEnd - 7) + ' ' + (lane.y - 5) + 'l7 5l-7 5'" />
          }
          @if (lane.complete !== undefined) {
            <line class="end" [attr.x1]="lane.complete" [attr.x2]="lane.complete" [attr.y1]="lane.y - 12" [attr.y2]="lane.y + 12" />
          }
          @if (lane.error !== undefined) {
            <path
              class="end end--error"
              [attr.d]="'M' + (lane.error - 8) + ' ' + (lane.y - 8) + 'l16 16m0 -16l-16 16'"
            />
          }
          @for (m of lane.marbles; track $index) {
            <g class="pill pill--{{ m.tone }}">
              <rect
                [attr.x]="m.x - m.width / 2"
                [attr.y]="lane.y - marbleH / 2"
                [attr.width]="m.width"
                [attr.height]="marbleH"
                [attr.rx]="marbleH / 2"
              />
              <text [attr.x]="m.x" [attr.y]="lane.y + 5" text-anchor="middle">{{ m.label }}</text>
            </g>
          }
        </ng-template>

        @for (lane of inputs(); track $index) {
          <ng-container [ngTemplateOutlet]="laneTpl" [ngTemplateOutletContext]="{ $implicit: lane }" />
        }
        @for (lane of outputs(); track $index) {
          <ng-container [ngTemplateOutlet]="laneTpl" [ngTemplateOutletContext]="{ $implicit: lane }" />
        }

        <!-- Curtain + playhead: reveals the timelines from left to right -->
        <g class="curtain" [class.curtain--play]="playing()">
          <rect [attr.x]="lineStart() - 6" y="0" [attr.width]="width + 40" [attr.height]="height()" />
          <line class="curtain__head" [attr.x1]="lineStart() - 6" [attr.x2]="lineStart() - 6" y1="0" [attr.y2]="height()" />
        </g>

        @for (lane of inputs(); track $index) {
          @if (lane.label) {
            <text class="lane__label" x="10" [attr.y]="lane.y + 4">{{ lane.label }}</text>
          }
        }
        @for (lane of outputs(); track $index) {
          @if (lane.label) {
            <text class="lane__label" x="10" [attr.y]="lane.y + 4">{{ lane.label }}</text>
          }
        }

        <rect class="op" x="10" [attr.y]="boxY()" [attr.width]="width - 20" [attr.height]="boxH" rx="9" />
        <text class="op__text" [attr.x]="width / 2" [attr.y]="boxY() + boxH / 2 + 4.5" text-anchor="middle">{{ data().op }}</text>
      </svg>
    </div>

    <ul class="legend">
      <li><span class="legend__pill"></span>{{ 'ui.marble.value' | t }}</li>
      <li><span class="legend__bar"></span>{{ 'ui.marble.complete' | t }}</li>
      <li><span class="legend__x">✕</span>{{ 'ui.marble.error' | t }}</li>
      <li><span class="legend__time">→</span>{{ 'ui.marble.time' | t }}</li>
    </ul>
  </div>
</section>
